[project]
name = "ecommerce-recommend-service"
version = "0.1.0"
description = "Platform-independent product recommendation service for online stores"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["core"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
