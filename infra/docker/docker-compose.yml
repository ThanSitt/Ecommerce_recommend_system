# Local development stack. Run from the repo root:
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Credentials match DATABASE_URL in .env.example. They are for local development only;
# a deployed VM must use real secrets from its own .env.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: recsys
      POSTGRES_PASSWORD: recsys
      POSTGRES_DB: recsys
    ports:
      - "5432:5432"
    volumes:
      # Named volume, so events survive container restarts. `down -v` deletes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recsys -d recsys"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
